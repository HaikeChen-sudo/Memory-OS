[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-intelligence"
version = "0.1.0"
description = "Reproducible retrieval and data-science kernel for Memory OS"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "strict"
